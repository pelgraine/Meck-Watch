[LilyGo_TWatchS3]
extends = esp32_base
extra_scripts = post:merge_firmware.py
board = lilygo_twatch_s3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = variants/lilygo_twatch_s3/meck_twatch_16mb.csv
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/lilygo_twatch_s3
  ; MECK_TWATCH gates the watch form factor (240x240, UI_ZOOM=2, touch, lock
  ; screen, tile grid, grey palette) and is shared with the S3 Plus.
  ; LILYGO_TWATCH_S3 gates hardware unique to this board.
  -D MECK_TWATCH
  -D LILYGO_TWATCH_S3
  ; The only key is the AXP2101 PWRON. Replaces PIN_USER_BTN, which is undefined
  ; here because there is no GPIO button (see variant.h).
  -D MECK_PMU_BUTTON
  -D TWATCH_COMPOSE_ENABLED
  -D BOARD_HAS_PSRAM=1
  -D CHANNEL_MSG_HISTORY_SIZE=800
  -D CORE_DEBUG_LEVEL=1
  -D FORMAT_SPIFFS_IF_FAILED=1
  -D FORMAT_LITTLEFS_IF_FAILED=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; ---- LoRa SX1262 ----
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=9
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=7
  -D P_LORA_SCLK=3
  -D P_LORA_MISO=4
  -D P_LORA_MOSI=1
  -D MECK_RX_DUTY_CYCLE
  ; ---- Display (ST7789V 240x240) + FT6336U touch via LovyanGFX ----
  -D DISPLAY_CLASS=TWatchS3Display
  -D UI_ZOOM=2
  ; ---- Misc ----
  -D AUTO_SHUTDOWN_MILLIVOLTS=3100
  -D ARDUINO_LOOP_STACK_SIZE=32768
  ; ---- No GPS ----
  ; HAS_GPS is deliberately left undefined, which drops the watch map screen.
  ; ENV_INCLUDE_GPS must be explicitly zeroed: sensor_base defaults it to 1, and
  ; it gates gpsStream, board.gpsPowerOn/Off and the GPS home page.
  -D ENV_INCLUDE_GPS=0
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_twatch_s3>
  +<helpers/sensors/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.0
  lewisxhe/XPowersLib @ ^0.2.7
  lewisxhe/SensorLib @ ^0.4.1
  adafruit/Adafruit GFX Library @ ^1.11.0
  bitbank2/PNGdec @ ^1.0.1
  WebServer
  DNSServer
  Update
  SD

; ---------------------------------------------------------------------------
; Standalone (no BLE companion), touch + display + lock screen.
; MAX_CONTACTS=2000 -- contact + sort arrays allocated in PSRAM via
; BaseChatMesh::initContacts().
; ---------------------------------------------------------------------------
[env:meck_twatch_s3_standalone]
extends = LilyGo_TWatchS3
build_flags =
  ${LilyGo_TWatchS3.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=2000
  -D MAX_GROUP_CHANNELS=20
  -D OFFLINE_QUEUE_SIZE=1
  -D ESP32_CPU_FREQ=80
  -D CPU_FREQ_IDLE=40
  -D CPU_FREQ_BOOST=40
  -D FIRMWARE_VERSION='"Meck TWatch S3 v1.5"'
  -D MECK_OTA_UPDATE
  ; -D MECK_TOUCH_DIAG
build_src_filter = ${LilyGo_TWatchS3.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
lib_deps =
  ${LilyGo_TWatchS3.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  AsyncTCP
  ESPAsyncWebServer
  ESP32 BLE Arduino

; ---------------------------------------------------------------------------
; BLE companion build -- same touch UI as the standalone, plus the BLE serial
; interface so a phone app can connect on occasion.
; Flash: pio run -e meck_twatch_s3_ble -t upload
; ---------------------------------------------------------------------------
[env:meck_twatch_s3_ble]
extends = LilyGo_TWatchS3
build_flags =
  ${LilyGo_TWatchS3.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=2000
  -D MAX_GROUP_CHANNELS=20
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=800
  -D ESP32_CPU_FREQ=80
  -D FIRMWARE_VERSION='"Meck TWatch S3 BLE v1.5"'
  -D MECK_OTA_UPDATE
build_src_filter = ${LilyGo_TWatchS3.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
lib_deps =
  ${LilyGo_TWatchS3.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  AsyncTCP
  ESPAsyncWebServer

; ---------------------------------------------------------------------------
; WiFi companion build -- same touch UI as the standalone, plus a TCP companion
; interface (port 5000) so an app can connect over the local network. WiFi
; credentials are compiled in via the WIFI_SSID/WIFI_PWD flags below -- edit
; them before building. Runs at 80 MHz (WiFi will not run below it).
; Flash: pio run -e meck_twatch_s3_wifi -t upload
; ---------------------------------------------------------------------------
[env:meck_twatch_s3_wifi]
extends = LilyGo_TWatchS3
build_flags =
  ${LilyGo_TWatchS3.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=2000
  -D MAX_GROUP_CHANNELS=20
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D TCP_PORT=5000
  -D MECK_WIFI_COMPANION=1
  -D OFFLINE_QUEUE_SIZE=800
  -D ESP32_CPU_FREQ=80
  -D FIRMWARE_VERSION='"Meck TWatch S3 WiFi v1.5"'
  -D MECK_OTA_UPDATE
build_src_filter = ${LilyGo_TWatchS3.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
lib_deps =
  ${LilyGo_TWatchS3.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  AsyncTCP
  ESPAsyncWebServer
  ESP32 BLE Arduino

; ---------------------------------------------------------------------------
; TEST BUILD: 20 MHz idle. Identical to meck_twatch_s3_standalone above except
; CPU_FREQ_IDLE, so the idle clock is the only variable.
;
; Boost stays at 40 MHz deliberately: every setBoost() site is a touch or key
; handler, so interaction runs at the speed already validated on this board,
; and only the display-off idle drops to 20.
; ---------------------------------------------------------------------------
[env:meck_twatch_s3_standalone_20mhz]
extends = LilyGo_TWatchS3
build_flags =
  ${LilyGo_TWatchS3.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=2000
  -D MAX_GROUP_CHANNELS=20
  -D OFFLINE_QUEUE_SIZE=1
  -D ESP32_CPU_FREQ=80
  -D CPU_FREQ_IDLE=20
  -D CPU_FREQ_BOOST=40
  -D FIRMWARE_VERSION='"Meck TWatch S3 20 v1.5"'
  -D MECK_OTA_UPDATE
build_src_filter = ${LilyGo_TWatchS3.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
lib_deps =
  ${LilyGo_TWatchS3.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  AsyncTCP
  ESPAsyncWebServer
  ESP32 BLE Arduino

; ---------------------------------------------------------------------------
; LilyGo T-Watch S3 -- SX1280 (2.4 GHz) radio revision.
; Same board, wiring and UI as the SX1262 watch above;
; only the radio silicon differs. Pin map confirmed against the arduino-esp32
; lilygo_twatch_s3 variant used by LilyGo's own SX1280 factory firmware, and
; against GrayHatGuy/MeshCore feat/lilygo-twatch-s3-and-2.4ghz-lora. Boot
; defaults follow the Sydney 2.4 GHz plan (2400.5 MHz / 406.25 kHz / SF11),
; which is also the first preset row.
; No external RF switch pins: the watch module handles TX/RX switching
; internally (LilyGoLib sets none).
;
; Differences from the SX1262 base:
;  - RADIO_CLASS/WRAPPER_CLASS -> CustomSX1280
;  - SX126X_* defines dropped (no DIO2 RF switch, no TCXO, no boosted RX gain)
;  - RADIOLIB_EXCLUDE_SX128X un-flagged, sub-GHz LORA_* defaults un-flagged
;  - MAX_LORA_TX_POWER=13 (SX1280 PA ceiling), LORA_MAX_BW=1625 (RadioLib max)
;  - MECK_TWATCH_1280 gates the 2.4 GHz preset table and bandwidth steps
;  - MECK_RX_DUTY_CYCLE omitted: RadioLib has no startReceiveDutyCycle for
;    SX128x, so the experimental battery saver cannot exist on this build
; ---------------------------------------------------------------------------
[LilyGo_TWatchS3_1280]
extends = esp32_base
extra_scripts = post:merge_firmware.py
board = lilygo_twatch_s3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = variants/lilygo_twatch_s3/meck_twatch_16mb.csv
build_unflags =
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D LORA_FREQ=869.525
  -D LORA_BW=250
; NOTE: root's "-D LORA_SF=11" is NOT unflagged: this build also wants SF11,
; and build_unflags strips every occurrence of the exact string -- including
; our own redefinition below. Two identical -D definitions are harmless.
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/lilygo_twatch_s3
  ; MECK_TWATCH gates the watch form factor (240x240, UI_ZOOM=2, touch, lock
  ; screen, tile grid, grey palette) and is shared with the S3 Plus.
  ; LILYGO_TWATCH_S3 gates hardware unique to this board.
  ; MECK_TWATCH_1280 gates the 2.4 GHz radio UI (presets, bandwidth steps).
  -D MECK_TWATCH
  -D LILYGO_TWATCH_S3
  -D MECK_TWATCH_1280
  ; The only key is the AXP2101 PWRON. Replaces PIN_USER_BTN, which is undefined
  ; here because there is no GPIO button (see variant.h).
  -D MECK_PMU_BUTTON
  -D TWATCH_COMPOSE_ENABLED
  -D BOARD_HAS_PSRAM=1
  -D CHANNEL_MSG_HISTORY_SIZE=800
  -D CORE_DEBUG_LEVEL=1
  -D FORMAT_SPIFFS_IF_FAILED=1
  -D FORMAT_LITTLEFS_IF_FAILED=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; ---- LoRa SX1280 (2.4 GHz) ----
  -D RADIO_CLASS=CustomSX1280
  -D WRAPPER_CLASS=CustomSX1280Wrapper
  -D LORA_FREQ=2400.5
  -D LORA_BW=406.25
  -D LORA_SF=11
  -D LORA_CR=8
  ; -D LORA_PREAMBLE=12
  -D LORA_TX_POWER=13
  -D MAX_LORA_TX_POWER=13
  -D LORA_MAX_BW=1625.0
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=9
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=7
  -D P_LORA_SCLK=3
  -D P_LORA_MISO=4
  -D P_LORA_MOSI=1
  ; ---- Display (ST7789V 240x240) + FT6336U touch via LovyanGFX ----
  -D DISPLAY_CLASS=TWatchS3Display
  -D UI_ZOOM=2
  ; ---- Misc ----
  -D AUTO_SHUTDOWN_MILLIVOLTS=3100
  -D ARDUINO_LOOP_STACK_SIZE=32768
  ; ---- No GPS ----
  ; HAS_GPS is deliberately left undefined, which drops the watch map screen.
  ; ENV_INCLUDE_GPS must be explicitly zeroed: sensor_base defaults it to 1, and
  ; it gates gpsStream, board.gpsPowerOn/Off and the GPS home page.
  -D ENV_INCLUDE_GPS=0
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_twatch_s3>
  +<helpers/sensors/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.0
  lewisxhe/XPowersLib @ ^0.2.7
  lewisxhe/SensorLib @ ^0.4.1
  adafruit/Adafruit GFX Library @ ^1.11.0
  bitbank2/PNGdec @ ^1.0.1
  WebServer
  DNSServer
  Update
  SD

; ---------------------------------------------------------------------------
; Standalone (no BLE companion), touch + display + lock screen.
